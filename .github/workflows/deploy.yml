name: Deploy

# Deploys have never succeeded on this repo: the previous workflow expected
# AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY repo secrets that were never set,
# so every run failed at "Configure AWS credentials". This uses GitHub OIDC
# instead — GitHub mints a short-lived token and assumes an IAM role, so there
# are no long-lived AWS keys stored in GitHub at all.
#
# One-time AWS setup is documented in docs/aws-setup.md.
#
# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
# whoever controls the action's repo can repoint v5 at new code, which then runs
# here with whatever the job holds. The trailing comment is the version the SHA
# was at -- to upgrade, resolve the new tag to its commit and replace both.

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'styles.css'
      - 'favicon.svg'
      - '404.html'
      - 'robots.txt'
      - 'sitemap.xml'
      - 'countdown/**'
      - 'game/**'
      - 'shared/**'
      - 'thermal/**'
      - 'weather/**'
      - 'lambda/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: branyontech.com
  CLOUDFRONT_DISTRIBUTION: E1MBTRO86GIH7E
  LAMBDA_FUNCTION: atmos-weather-api
  LAMBDA_RUNTIME: nodejs22.x

jobs:
  site:
    name: Static site → S3
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Long-lived caching for fingerprint-free assets is unsafe, so assets get
      # a modest TTL and HTML gets a short one. CloudFront is invalidated below.
      - name: Sync HTML
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" \
            --exclude '*' \
            --include 'index.html' --include '404.html' \
            --include 'robots.txt' --include 'sitemap.xml' \
            --include 'countdown/index.html' \
            --include 'game/index.html' \
            --include 'thermal/index.html' \
            --include 'weather/index.html' \
            --cache-control 'public, max-age=300'

      - name: Sync assets
        run: |
          aws s3 sync . "s3://${S3_BUCKET}/" \
            --exclude '*' \
            --include 'styles.css' --include 'favicon.svg' \
            --include 'countdown/script.js' --include 'countdown/calc.js' \
            --include 'countdown/styles.css' --include 'countdown/favicon.svg' \
            --include 'countdown/stats.json' \
            --include 'shared/daily.js' \
            --include 'game/script.js' \
            --include 'game/putt.js' --include 'game/styles.css' \
            --include 'game/favicon.svg' \
            --include 'thermal/flight.js' --include 'thermal/script.js' \
            --include 'thermal/sky.js' --include 'thermal/astro.js' \
            --include 'thermal/styles.css' --include 'thermal/favicon.svg' \
            --cache-control 'public, max-age=3600'

      - name: Sync weather console
        run: |
          aws s3 sync weather/ "s3://${S3_BUCKET}/weather/" \
            --exclude 'index.html' \
            --cache-control 'public, max-age=3600' \
            --delete
          # Fonts are content-addressed by name and never change in place.
          aws s3 cp "s3://${S3_BUCKET}/weather/assets/" "s3://${S3_BUCKET}/weather/assets/" \
            --recursive --metadata-directive REPLACE \
            --cache-control 'public, max-age=31536000, immutable' \
            --content-type 'font/woff2' --exclude '*' --include '*.woff2'

      - name: Invalidate CloudFront
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION}" \
            --paths '/*' >/dev/null
          echo "invalidation submitted"

  api:
    name: Weather API → Lambda
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Package and deploy
        run: |
          cd lambda && zip -qr ../function.zip . && cd ..
          aws lambda update-function-code \
            --function-name "${LAMBDA_FUNCTION}" \
            --zip-file fileb://function.zip \
            --publish >/dev/null
          echo "lambda updated"

      # The runtime is set in AWS, not here: update-function-code never touches
      # it, so nothing in this repo would notice when AWS deprecates it or
      # someone changes it in the console. It has to stay in step with the
      # engines floor in package.json and the node-version in test.yml.
      #
      # Checked after the code ships, deliberately. A drifted runtime should be
      # a loud failure, not a gate that blocks deploying a fix.
      - name: Assert the Lambda runtime
        run: |
          actual=$(aws lambda get-function-configuration \
            --function-name "${LAMBDA_FUNCTION}" \
            --query Runtime --output text)
          if [ "$actual" != "${LAMBDA_RUNTIME}" ]; then
            echo "::error::Lambda runtime is '$actual', expected '${LAMBDA_RUNTIME}'."
            echo "Move LAMBDA_RUNTIME here, engines in package.json and node-version in test.yml together."
            exit 1
          fi
          echo "runtime $actual"

# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
# whoever controls the action's repo can repoint v5 at new code, which then runs
# here with whatever the job holds. The trailing comment is the version the SHA
# was at -- to upgrade, resolve the new tag to its commit and replace both.

name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Run client-side tests
        run: node tests.js

      - name: Run server integration tests
        run: node tests-server.js

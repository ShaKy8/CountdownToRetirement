# Third-party actions are pinned to commit SHAs, not tags. A tag is mutable:
# whoever controls the action's repo can repoint v5 at new code, which then runs
# here with whatever the job holds. The trailing comment is the version the SHA
# was at -- to upgrade, resolve the new tag to its commit and replace both.

name: Run Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'

      # Build only in the runner's disposable checkout, just as deploy.yml does.
      # Date-dependent homepage counts and content stamps are generated output;
      # tests must inspect the bytes that would ship without committing them.
      - name: Prepare production build
        run: |
          node scripts/bake-home.mjs
          node scripts/stamp-assets.mjs

      - name: Run client-side tests
        run: node tests.js

      - name: Test satellite fetching offline
        run: node --test tests/fetch-sats.test.mjs

      - name: Run server integration tests
        run: node tests-server.js

      - name: Run Postcards integration checks
        run: node --test tests/postcards-integration.test.cjs

      - name: Run Elevator 86 gameplay and deployment checks
        run: node --test tests/elevator.test.cjs

      - name: Run Starfall gameplay and deployment checks
        run: node --test tests/asteroids.test.cjs

      - name: Run Ironwing flight and deployment checks
        run: node --test tests/ironwing.test.cjs

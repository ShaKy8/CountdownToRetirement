name: Satellite elements

# Fetches CelesTrak's orbital elements for the weather console's SATELLITES
# layer and publishes them to s3://branyontech.com/sats/. CelesTrak updates
# every 2 hours and answers a repeat download with 403 (and firewalls an IP
# that keeps asking), so this is the ONLY thing that talks to it: visitors read
# the snapshot from our own origin. Only confirmed TCP connect timeouts are
# retried (three tries total); all HTTP non-200s, including redirects, stop.
# A shared S3 cooldown also covers delayed/manual/failed/partial runs.
# A failed run leaves the previous snapshot; the console shows its age.

on:
  schedule:
    - cron: '23 */2 * * *'
  workflow_dispatch:

concurrency:
  group: sats
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  AWS_REGION: us-east-1
  S3_BUCKET: branyontech.com

jobs:
  sats:
    name: CelesTrak -> S3
    runs-on: ubuntu-24.04
    timeout-minutes: 20 # Must match JOB_BUDGET_MS in scripts/sats-cooldown.mjs.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Reserve CelesTrak update window
        id: cooldown
        run: node scripts/sats-cooldown.mjs reserve

      - name: Fetch elements
        if: steps.cooldown.outputs.ready == 'true'
        run: node scripts/fetch-sats.mjs "$RUNNER_TEMP/sats"

      - name: Record cooldown even after a partial or failed fetch
        if: always() && steps.cooldown.outputs.ready == 'true'
        run: node scripts/sats-cooldown.mjs finish

      # Files are gzipped by the script, so say so; S3 does not compress.
      - name: Publish
        if: success() && steps.cooldown.outputs.ready == 'true'
        run: |
          aws s3 cp "$RUNNER_TEMP/sats/" "s3://${S3_BUCKET}/sats/" --recursive \
            --content-type 'application/json' --content-encoding gzip \
            --cache-control 'public, max-age=600'

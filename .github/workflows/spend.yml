# The weekly spend check. scripts/spend-check.mjs reads both bills - AWS from
# Cost Explorer, Anthropic from the token counts the Lambda logs per model
# call - and fails the job when either is on course to pass its limit. A
# failed scheduled run is what GitHub sends mail about, so the limits below
# are the alert thresholds.
#
# ANTHROPIC_ADMIN_KEY is an optional repository secret. Without it the
# Anthropic line is priced from the logs; with it the organisation's own cost
# report is fetched and printed beside the estimate.
#
# Third-party actions are pinned to commit SHAs, not tags, as in deploy.yml.
# GitHub pauses schedules in repositories with no commits for 60 days.

name: Spend check

on:
  schedule:
    - cron: '0 15 * * 1'      # Mondays, 08:00 Pacific daylight / 07:00 standard
  workflow_dispatch:

permissions:
  id-token: write      # required to request the OIDC token
  contents: read

env:
  AWS_REGION: us-east-1
  LAMBDA_FUNCTION: atmos-weather-api
  AWS_LIMIT: '5'
  ANTHROPIC_LIMIT: '5'

jobs:
  spend:
    name: Both bills against their limits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Check both bills
        env:
          ANTHROPIC_ADMIN_KEY: ${{ secrets.ANTHROPIC_ADMIN_KEY }}
        run: node scripts/spend-check.mjs
